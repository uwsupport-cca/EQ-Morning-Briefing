<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EQ Morning Briefing — 19 May 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#faf9f7;color:#1a1a18;font-size:14px;}
  .page{max-width:1140px;margin:0 auto;padding:32px 24px;}
  .note-block:hover{opacity:0.85;}
  .note-copied{background:#E1F5EE!important;border-left-color:#1D9E75!important;}
  .case-row.hidden{display:none;}
  a[href^="http"]:hover{text-decoration:underline;}
  @media print{.noprint{display:none;}body{background:white;}}
</style></head><body>
<div class="page">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:24px;padding-bottom:16px;border-bottom:0.5px solid #d3d1c7;flex-wrap:wrap;gap:10px;">
    <div>
      <div style="font-size:24px;font-weight:600;">EQ Morning Briefing</div>
      <div style="font-size:13px;color:#888;margin-top:4px;">
        19 May 2026 · 0 cases ·
        Scraped 01:07 pm
         · <span style="color:#0F6E56;">SF staff matched</span>
      </div>
    </div>
    <div class="noprint" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <input id="search-box" type="search" placeholder="Search client, ID, note..."
        style="padding:8px 12px;border:1px solid #d3d1c7;border-radius:6px;
          font-size:13px;background:white;width:220px;">
      <select id="uw-filter"
        style="padding:8px 12px;border:1px solid #d3d1c7;border-radius:6px;
          font-size:13px;background:white;cursor:pointer;">
        <option value="all">All staff</option>
        
      </select>
      <button id="print-btn"
        style="padding:8px 18px;background:#005fb2;color:white;border:none;
          border-radius:6px;cursor:pointer;font-size:13px;">
        Print / Save PDF
      </button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:32px;">
    
        <a href="#sec-updates" style="text-decoration:none;">
          <div style="background:white;border:0.5px solid #e5e3db;border-radius:8px;
            padding:14px;cursor:pointer;transition:border-color 0.15s;"
            onmouseover="this.style.borderColor='#0F6E56'"
            onmouseout="this.style.borderColor='#e5e3db'">
            <div style="font-size:11px;color:#888;margin-bottom:6px;">Recent updates</div>
            <div style="font-size:26px;font-weight:600;color:#0F6E56;">0</div>
            <div style="font-size:10px;color:#bbb;margin-top:4px;">Today & yesterday</div>
          </div>
        </a>
    
        <a href="#sec-cancelled" style="text-decoration:none;">
          <div style="background:white;border:0.5px solid #e5e3db;border-radius:8px;
            padding:14px;cursor:pointer;transition:border-color 0.15s;"
            onmouseover="this.style.borderColor='#A32D2D'"
            onmouseout="this.style.borderColor='#e5e3db'">
            <div style="font-size:11px;color:#888;margin-bottom:6px;">Cancelled (7d)</div>
            <div style="font-size:26px;font-weight:600;color:#A32D2D;">0</div>
            <div style="font-size:10px;color:#bbb;margin-top:4px;">Within 7 days</div>
          </div>
        </a>
    
        <a href="#sec-completed" style="text-decoration:none;">
          <div style="background:white;border:0.5px solid #e5e3db;border-radius:8px;
            padding:14px;cursor:pointer;transition:border-color 0.15s;"
            onmouseover="this.style.borderColor='#185FA5'"
            onmouseout="this.style.borderColor='#e5e3db'">
            <div style="font-size:11px;color:#888;margin-bottom:6px;">Completed (7d)</div>
            <div style="font-size:26px;font-weight:600;color:#185FA5;">0</div>
            <div style="font-size:10px;color:#bbb;margin-top:4px;">Within 7 days</div>
          </div>
        </a>
    
        <a href="#sec-overdue" style="text-decoration:none;">
          <div style="background:white;border:0.5px solid #e5e3db;border-radius:8px;
            padding:14px;cursor:pointer;transition:border-color 0.15s;"
            onmouseover="this.style.borderColor='#854F0B'"
            onmouseout="this.style.borderColor='#e5e3db'">
            <div style="font-size:11px;color:#888;margin-bottom:6px;">No movement</div>
            <div style="font-size:26px;font-weight:600;color:#854F0B;">0</div>
            <div style="font-size:10px;color:#bbb;margin-top:4px;">5+ days stale</div>
          </div>
        </a>
    
        <a href="#sec-ontrack" style="text-decoration:none;">
          <div style="background:white;border:0.5px solid #e5e3db;border-radius:8px;
            padding:14px;cursor:pointer;transition:border-color 0.15s;"
            onmouseover="this.style.borderColor='#444'"
            onmouseout="this.style.borderColor='#e5e3db'">
            <div style="font-size:11px;color:#888;margin-bottom:6px;">On track</div>
            <div style="font-size:26px;font-weight:600;color:#444;">0</div>
            <div style="font-size:10px;color:#bbb;margin-top:4px;">< 5 days</div>
          </div>
        </a>
    <div style="background:white;border:0.5px solid #e5e3db;border-radius:8px;padding:14px;">
      <div style="font-size:11px;color:#888;margin-bottom:6px;">Total cases</div>
      <div style="font-size:26px;font-weight:600;color:#444;">0</div>
    </div>
  </div>

  
  
  
  
  

</div>
<script>
document.getElementById('print-btn').addEventListener('click', function(){ window.print(); });

function applyFilters() {
  var staff = document.getElementById('uw-filter').value;
  var q = (document.getElementById('search-box').value||'').toLowerCase().trim();
  document.querySelectorAll('.case-row').forEach(function(row) {
    var staffOk = (staff === 'all' || row.dataset.uw === staff);
    var searchOk = (!q || (row.dataset.search||'').indexOf(q) !== -1);
    if (staffOk && searchOk) row.classList.remove('hidden');
    else row.classList.add('hidden');
  });
  document.querySelectorAll('div[id^="sec-"]').forEach(function(sec) {
    var visible = sec.querySelectorAll('.case-row:not(.hidden)').length;
    var header = sec.querySelector('.sec-header');
    if (header) {
      var base = header.innerText.split('—')[0].trim();
      header.innerText = base + ' — ' + visible + ' case' + (visible!==1?'s':'');
    }
    sec.style.display = visible === 0 ? 'none' : '';
  });
}
document.getElementById('uw-filter').addEventListener('change', applyFilters);
document.getElementById('search-box').addEventListener('input', applyFilters);

document.querySelectorAll('.note-block').forEach(function(el) {
  el.addEventListener('click', function() {
    const text = (el.dataset.note||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
    const hint = el.querySelector('.cp-hint');
    navigator.clipboard.writeText(text).then(function() {
      el.classList.add('note-copied');
      if (hint) hint.innerText = '✓ copied!';
      setTimeout(function() {
        el.classList.remove('note-copied');
        if (hint) hint.innerText = 'click to copy';
      }, 2000);
    });
  });
});
</script>
</body></html>
